# : << 'EOF'
# Oh my tmux! — local overrides
# https://github.com/gpakosz/.tmux


# -- bindings ------------------------------------------------------------------

tmux_conf_preserve_stock_bindings=false


# -- session creation ----------------------------------------------------------

tmux_conf_new_session_prompt=false
tmux_conf_new_session_retain_current_path=true


# -- windows & pane creation ---------------------------------------------------

tmux_conf_new_window_retain_current_path=true
tmux_conf_new_window_reconnect_ssh=false
tmux_conf_new_pane_retain_current_path=true
tmux_conf_new_pane_reconnect_ssh=false


# -- display -------------------------------------------------------------------

tmux_conf_24b_colour=auto


# -- theming -------------------------------------------------------------------

# Status bar managed manually below; oh-my-tmux theme disabled.
tmux_conf_theme=disabled


# -- clipboard -----------------------------------------------------------------

tmux_conf_copy_to_os_clipboard=true


# -- urlscan -------------------------------------------------------------------

tmux_conf_urlscan_options="--compact --dedupe"


# -- user customizations -------------------------------------------------------

set -g mouse on
set -g status-keys emacs
set -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g window-status-separator "#[fg=#3d3d52] | "
set -g status-style "bg=#1e1e2e"
set -g window-status-style "fg=#6e6c7e"
set -g window-status-current-style "fg=#cba6f7,bold"
set -g window-status-format " #(python3 -c \"s='⁰¹²³⁴⁵⁶⁷⁸⁹';i=#I;print(s[i] if i<len(s) else str(i))\") #W "
set -g window-status-current-format " #(python3 -c \"s='⁰¹²³⁴⁵⁶⁷⁸⁹';i=#I;print(s[i] if i<len(s) else str(i))\") #W "

set -wg monitor-activity on
set -g visual-activity off

set-option -g update-environment "TERM_PROGRAM"

# -- prefix --------------------------------------------------------------------

set -g prefix2 C-a
bind C-a send-prefix -2


# -- splits --------------------------------------------------------------------

bind m run "cut -c3- '#{TMUX_CONF}' | sh -s _toggle_mouse" \; display 'mouse #{?#{mouse},on,off}'

bind _ split-window -v
bind | split-window -h
bind / split-window -h -c "#{pane_current_path}"


# -- Russian layout duplicates -------------------------------------------------

# navigation (hjkl → рол д)
bind -r р select-pane -L
bind -r о select-pane -D
bind -r л select-pane -U
bind -r д select-pane -R

# resize (HJKL → РОДЛ)
bind -r Р resize-pane -L 2
bind -r О resize-pane -D 2
bind -r Л resize-pane -U 2
bind -r Д resize-pane -R 2

# windows & sessions
bind с new-window -c "#{pane_current_path}"
bind ц choose-tree -Zw
bind ы choose-tree -Zs
bind й display-panes
bind з paste-buffer -p
bind щ select-pane -t :.+
bind ч confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind я resize-pane -Z
bind в detach-client
bind е clock-mode
bind ш display-message
bind ь run-shell "cut -c3- '#{TMUX_CONF}' | sh -s _toggle_mouse" \; display-message "mouse #{?#{mouse},on,off}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind к source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind а command-prompt { find-window -Z "%%" }
bind и list-buffers
bind ж last-pane
bind б command-prompt -I "#W" { rename-window "%%" }

# copy mode & buffers ([] → хъ)
bind х copy-mode
bind ъ paste-buffer -p

# uppercase
bind В choose-client -Z
bind У select-layout -E
bind З choose-buffer
bind Ь select-pane -M
bind С customize-mode -Z

# edit config (у → e)
bind у new-window -n "#{TMUX_CONF_LOCAL}" sh -c "_E=\${VISUAL:-\${EDITOR:-vim}}; case \"\$_E\" in *vim*) \$_E -c \":set syntax=tmux\" \"\$TMUX_CONF_LOCAL\";; *) \$_E \"\$TMUX_CONF_LOCAL\";; esac && \"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} source \"\$TMUX_CONF\" \\; display \"\$TMUX_CONF_LOCAL sourced\""

# yank (tmux-yank)
bind н run-shell -b /Users/unnme/.config/tmux/plugins/tmux-yank/scripts/copy_line.sh
bind Н run-shell -b /Users/unnme/.config/tmux/plugins/tmux-yank/scripts/copy_pane_pwd.sh


# -- tpm -----------------------------------------------------------------------

tmux_conf_update_plugins_on_launch=false
tmux_conf_update_plugins_on_reload=false
tmux_conf_uninstall_plugins_on_reload=false

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-yank'


# -- custom variables ----------------------------------------------------------

# to define a custom #{foo} variable, define a POSIX shell function between
# the '# EOF' and the '# "$@"' lines. See README.md for examples.

# ------------------------------------------------------------------------------

# # /!\ do not remove the following line
# EOF
#
# "$@"
# # /!\ do not remove the previous line
# #     do not write below this line
