# AeroSpace Configuration
# Startup commands after-startup-command = []

# Auto-start with login
start-at-login = true

# Container normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = false

# Layout settings
accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Key mapping
key-mapping.preset = 'qwerty'

# Mouse behavior
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Keep apps hidden when cmd-h is used
automatically-unhide-macos-hidden-apps = false

[workspace-to-monitor-force-assignment]
1 = 1
2 = 1
3 = 1
4 = 1
5 = 1
6 = 1
7 = 1
8 = 1
9 = 1
10 = 1
11 = 2
12 = 2
13 = 2
14 = 2
15 = 2
16 = 2
17 = 2
18 = 2
19 = 2
20 = 2

# Gaps configuration
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.top = 5
outer.left = 5
outer.bottom = 5
outer.right = 5

# Environment variables
[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# Main mode key bindings
[mode.main.binding]

# Layout switching
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus navigation
alt-h = 'focus left --boundaries all-monitors-outer-frame'
alt-j = 'focus down --boundaries all-monitors-outer-frame'
alt-k = 'focus up --boundaries all-monitors-outer-frame'
alt-l = 'focus right --boundaries all-monitors-outer-frame'

# Window movement
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Window resizing
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspace navigation
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-f1 = 'workspace 11'
alt-f2 = 'workspace 12'
alt-f3 = 'workspace 13'
alt-f4 = 'workspace 14'
alt-f5 = 'workspace 15'
alt-f6 = 'workspace 16'
alt-f7 = 'workspace 17'
alt-f8 = 'workspace 18'
alt-f9 = 'workspace 19'
alt-f10 = 'workspace 20'

# Move window to workspace
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']
alt-shift-f1 = ['move-node-to-workspace 11', 'workspace 11']
alt-shift-f2 = ['move-node-to-workspace 12', 'workspace 12']
alt-shift-f3 = ['move-node-to-workspace 13', 'workspace 13']
alt-shift-f4 = ['move-node-to-workspace 14', 'workspace 14']
alt-shift-f5 = ['move-node-to-workspace 15', 'workspace 15']
alt-shift-f6 = ['move-node-to-workspace 16', 'workspace 16']
alt-shift-f7 = ['move-node-to-workspace 17', 'workspace 17']
alt-shift-f8 = ['move-node-to-workspace 18', 'workspace 18']
alt-shift-f9 = ['move-node-to-workspace 19', 'workspace 19']
alt-shift-f10 = ['move-node-to-workspace 20', 'workspace 20']

# Workspace utilities
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service mode
alt-shift-semicolon = 'mode service'

# Service mode bindings
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
alt-shift-semicolon = ['fullscreen', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ─── App workspace assignments ───────────────────────────────────────────────

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'ai.elementlabs.lmstudio'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.google.android.studio'
run = ['move-node-to-workspace 3']

